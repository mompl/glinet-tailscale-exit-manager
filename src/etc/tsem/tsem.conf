# tsem configuration. Parsed line by line (never executed); unknown or invalid
# values are ignored with a log message. See docs/rc/config.md.

# Exit nodes (Tailscale IPv4). Primary is preferred; secondary is used on failure.
# Each node is identified by IP AND name: tsem only uses a node when `tailscale status --json`
# shows that exactly this name owns exactly this IP, is online and is an approved exit node
# (otherwise its health counts as failed; never auto-selects another node, never opens).
# Check after editing: tsem verify-nodes   (read-only)
# Set by setup.sh, or by hand: tsem config set TSEM_PRIMARY=100.x.y.z TSEM_PRIMARY_NAME=<peer name> [TSEM_SECONDARY=... TSEM_SECONDARY_NAME=...]
# Empty here on purpose: no node is ever assumed. Without a primary only DIRECT works (GERMAN refuses to start).
TSEM_PRIMARY=
TSEM_PRIMARY_NAME=
TSEM_SECONDARY=
TSEM_SECONDARY_NAME=

# Protected LAN-side interfaces (forwarded traffic from these is guarded).
TSEM_LAN_IFACES="br-lan"
# Extra egress interfaces LAN clients may use in GERMAN mode (e.g. a WireGuard server
# interface). Default: none, i.e. strictly tunnel-only.
TSEM_ALLOW_OUT_IFACES=""

TSEM_TS_IFACE=tailscale0
TSEM_TS_TABLE=52
# Layer 1 (policy routing). Priority must be HIGHER than tailscale's "lookup 52" rule
# (5270). Check with: tsem selftest
TSEM_RT_GUARD=on
TSEM_RULE_PRIO=5280

# Tailnet ranges that stay reachable in BLOCKED. Add advertised subnets of other nodes here.
# Explicit, no blanket RFC1918: list the IPv4 subnets advertised by your exit nodes that the LAN should still reach in BLOCKED
# (GERMAN allows everything via tailscale0 anyway). Example: "192.168.50.0/24 192.168.60.0/24". The router's fw3 masquerading
# (zone tailscale0, masq=1) provides the SNAT; tsem never touches it. Check the routes with: ip route show table 52
TSEM_ALLOW_SUBNETS4=""
TSEM_ALLOW_SUBNETS6=""

# Management over a WAN-side private network (v1.1). Example: a GL-E5800 reached over its Wi-Fi uplink (10.50.0.0/24). The router's own
# traffic to exactly these networks stays allowed while protected (SSH replies, web UI); nothing else leaves the router outside the
# tunnel. Use only networks you trust: a host on them can reach the router. Empty = off (default).
TSEM_ADMIN_SUBNETS4=""
TSEM_ADMIN_SUBNETS6=""

# DNS: if set, ALL LAN client DNS (udp/tcp 53), including queries to the router, is
# redirected to this resolver (IPv4) while GERMAN/BLOCKED is active, so it travels
# through the tunnel or is blocked. Empty = clients may use the router's resolver
# (the router's own upstream queries are NOT covered; see docs/rc/dns-ipv6.md).
TSEM_DNS_REDIRECT=""
# Router-OWN DNS (F03). While protected, the router's own port-53 queries (dnsmasq upstream, nslookup, tailscaled) are
# redirected to this resolver, which must be reachable THROUGH THE EXIT NODE. Without it the ISP resolvers the router
# got from the WAN (not reachable from the exit node) time out and DNS is dead in GERMAN. In BLOCKED the redirected
# query still cannot leave (TSEM_OUT). DIRECT is untouched. Empty = no redirect (not recommended).
TSEM_DNS_ROUTER="1.1.1.1"
# Optional DNS health probe host (resolved via the system resolver).
TSEM_DNS_PROBE_HOST=""

# Router's own traffic (chain TSEM_OUT in OUTPUT, IPv4+IPv6). See docs/rc/router-egress.md.
TSEM_OUT_GUARD=on
# Extra local interfaces the router may send to freely (e.g. a WireGuard server): space separated.
TSEM_OUT_LOCAL_IFACES=""
# Router NTP (udp/123) is allowed while protected. Set 0 to forbid (clock may drift).
TSEM_ALLOW_NTP=1
# tailscaled's own underlay DNS (marked packets, port 53) stays blocked unless set to 1.
TSEM_ALLOW_UNDERLAY_DNS=0
# fwmark tailscaled puts on its own control/underlay packets (value/mask). Verify with: tsem diag
TSEM_UNDERLAY_MARK=0x80000/0xff0000

# Timing. TSEM_INTERVAL is the FAST interval (connecting/recovery/blocked/error). Slower
# intervals apply only when the state is settled; events (hardware switch, hotplug, fw reload) act immediately.
TSEM_INTERVAL=5
TSEM_INTERVAL_RECOVERY=15
TSEM_INTERVAL_STEADY=20
TSEM_INTERVAL_IDLE=60
TSEM_FAIL_N=3
TSEM_UP_N=2
TSEM_RETURN_N=6
TSEM_DWELL=60
TSEM_BACKOFF_MIN=30
TSEM_BACKOFF_MAX=300

# Egress probe (HTTPS from the router through the selected exit node)
TSEM_PROBE_URLS="https://1.1.1.1/cdn-cgi/trace https://9.9.9.9/"
TSEM_PROBE_TIMEOUT=5

# Optional: file whose first word is on|off (hardware switch state) for status output only.
TSEM_HW_STATE_FILE=""
